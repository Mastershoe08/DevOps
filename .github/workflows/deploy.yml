name: Deploy Stack

on:
  push:
    branches: [master, main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Run deploy script
        run: |
          
          chmod +x deploy_stack.sh
          ./deploy_stack.sh
